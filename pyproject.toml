[project]
name = "astrbot-plugin-eyewitness-memory"
version = "0.1.4"
description = "Evidence-first automatic group memory for AstrBot"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-aiohttp>=1,<2", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
